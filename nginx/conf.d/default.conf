server {
    listen 8080;

    location /Account/ {
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_pass http://account:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect http://account:8081/ /Account/;
    }

    location /Hospital/ {
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_pass http://hospital:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect http://hospital:8081/ /Hospital/;
    }

    location /History/ {
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_pass http://history:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect http://history:8081/ /History/;
    }

    location /Timetable/ {
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_pass http://timetable:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect http://timetable:8081/ /Timetable/;
    }

    root /usr/share/nginx/html;
    index welcome.html;
 
    location / {
        try_files $uri $uri/ =404;
    }
}